<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a2e">
<meta name="format-detection" content="telephone=no">
<title>Breathe</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;height:-webkit-fill-available;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
    overflow:hidden;
    background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(90,60,180,.18), transparent 60%),
        radial-gradient(ellipse 70% 50% at 85% 80%, rgba(40,120,200,.15), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #151544 0%, #0a0a2a 60%, #050518 100%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Helvetica Neue',Arial,sans-serif;
    color:#e0e0ff;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overscroll-behavior:none;-webkit-overflow-scrolling:touch;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}
.card{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:20px 20px 18px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    max-width:360px;width:calc(100vw - 32px);
    max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none;
}
.card::-webkit-scrollbar{display:none}
.header{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.title{
    font-size:1.1rem;font-weight:300;letter-spacing:4px;text-transform:uppercase;
    color:#a0c4ff;text-shadow:0 0 12px rgba(160,196,255,.2);
}
.sess-time{
    font-size:.95rem;font-weight:300;letter-spacing:2px;color:#c0d8ff;
    font-feature-settings:"tnum";font-variant-numeric:tabular-nums;
    display:none;
}
.sess-time.on{display:block}
.sess-time.warn{color:#ffb74d}
.sess-time.crit{color:#ef5350;animation:blink 1s ease-in-out infinite}
.sess-time.done{color:#66bb6a;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.sess-bar{
    width:100%;height:3px;background:rgba(255,255,255,.06);
    border-radius:2px;overflow:hidden;opacity:0;transition:opacity .3s;
}
.sess-bar.on{opacity:1}
.sess-bar-fill{
    height:100%;width:0;
    background:linear-gradient(90deg,#4fc3f7,#66bb6a);
    transition:width .4s linear;
}
.breath-wrap{
    position:relative;
    width:clamp(140px,42vw,200px);height:clamp(140px,42vw,200px);
    display:flex;justify-content:center;align-items:center;flex-shrink:0;
}
.prog-track{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    width:80%;height:3px;background:rgba(255,255,255,.07);
    border-radius:2px;overflow:hidden;
}
.prog-fill{
    height:100%;width:0;
    background:linear-gradient(90deg,#4fc3f7,#81d4fa);
    border-radius:2px;transition:width .1s linear;
}
.ring-svg{position:absolute;width:95%;height:95%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.04);stroke-width:2.5}
.ring-fg{
    fill:none;stroke:#4fc3f7;stroke-width:2.5;stroke-linecap:round;
    stroke-dasharray:565.49;stroke-dashoffset:565.49;
    transition:stroke .4s;
    filter:drop-shadow(0 0 3px rgba(79,195,247,.35));
}
.bound{
    position:absolute;width:85%;height:85%;border-radius:50%;
    border:1px solid rgba(160,196,255,.08);
    display:flex;justify-content:center;align-items:center;
}
.orb{
    position:relative;
    width:clamp(80px,23vw,109px);height:clamp(80px,23vw,109px);
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#4fc3f7,#0288d1);
    box-shadow:0 0 52px rgba(79,195,247,.3),inset 0 0 21px rgba(255,255,255,.06);
    display:flex;justify-content:center;align-items:center;
    transform:scale(.4762);
    transform-origin:center center;
    will-change:transform;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transition:box-shadow .5s ease;
}
/* Color-cross-fade layers. They sit on top of the base (inhale) gradient
   and fade in/out via opacity — which is smoothly interpolable, unlike
   radial-gradient itself. */
.orb::before,
.orb::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
}
.orb::before{ background:radial-gradient(circle at 30% 30%,#7e57c2,#4527a0); } /* exhale */
.orb::after{  background:radial-gradient(circle at 30% 30%,#ffb74d,#f57c00); } /* hold */
.orb.exhale::before{ opacity:1; }
.orb.hold::after{ opacity:1; }

.orb.inhale{
    box-shadow:0 0 73px rgba(79,195,247,.45),inset 0 0 21px rgba(255,255,255,.06);
}
.orb.exhale{
    box-shadow:0 0 73px rgba(126,87,194,.45),inset 0 0 21px rgba(255,255,255,.06);
}
.orb.hold{
    box-shadow:0 0 73px rgba(255,183,77,.45),inset 0 0 21px rgba(255,255,255,.06);
}
.orb.dim{opacity:.5}
.hold-num{
    font-size:clamp(2.1rem,6.3vw,2.73rem);font-weight:700;color:#fff;
    text-shadow:0 0 13px rgba(255,255,255,.35);
    opacity:0;position:absolute;pointer-events:none;
    z-index:1;
    transition:opacity .25s;
}
.hold-num.vis{opacity:1}
.status{text-align:center;line-height:1.5;flex-shrink:0}
.phase-text{
    font-size:.95rem;font-weight:300;letter-spacing:3px;text-transform:uppercase;
    color:#b0c4ff;
}
.phase-text.blink{animation:blink 1.5s ease-in-out infinite}
.sub-text{font-size:.65rem;color:rgba(176,196,255,.45);letter-spacing:1.5px}
.btns{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:center}
.b{
    padding:10px 22px;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;
    border:none;border-radius:30px;cursor:pointer;
    transition:all .25s;font-weight:500;font-family:inherit;
    -webkit-appearance:none;appearance:none;outline:none;
    min-height:44px;min-width:44px;
    display:inline-flex;align-items:center;justify-content:center;
    touch-action:manipulation;color:#fff;
}
.b:disabled{opacity:.2;cursor:default}
.b:active:not(:disabled){transform:scale(.95)}
.b-go{background:linear-gradient(135deg,#4fc3f7,#0288d1)}
.b-pa{background:linear-gradient(135deg,#ffb74d,#f57c00)}
.b-res{background:linear-gradient(135deg,#66bb6a,#2e7d32)}
.b-stop{background:linear-gradient(135deg,#ef5350,#c62828)}
.cfg-wrap{width:100%;flex-shrink:0}
.cfg-toggle{
    display:flex;align-items:center;justify-content:center;gap:5px;
    padding:8px 0 2px;cursor:pointer;user-select:none;
    color:rgba(176,196,255,.4);font-size:.7rem;letter-spacing:2px;
    text-transform:uppercase;transition:color .2s;
    min-height:44px;touch-action:manipulation;
}
.cfg-toggle:hover,.cfg-toggle:active{color:rgba(176,196,255,.7)}
.cfg-toggle .arr{display:inline-block;font-size:.55rem;transition:transform .3s}
.cfg-toggle.open .arr{transform:rotate(180deg)}
.cfg-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.cfg-body.open{max-height:380px}
.cfg-inner{padding:10px 0 0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-direction:column;gap:6px}
.row-head{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.6px;color:#7788bb}
.row-val{color:#a0c4ff;font-weight:600;font-size:.8rem}
input[type="range"]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;border-radius:2px;
    background:rgba(255,255,255,.07);
    outline:none;cursor:pointer;
    padding:12px 0;margin:0;background-clip:content-box;
    touch-action:manipulation;
}
input[type="range"]::-webkit-slider-runnable-track{
    height:3px;border-radius:2px;background:rgba(255,255,255,.07);
}
input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,#4fc3f7,#0288d1);
    box-shadow:0 0 5px rgba(79,195,247,.3);
    cursor:pointer;margin-top:-10px;border:none;
}
input[type="range"]::-moz-range-track{
    height:3px;border-radius:2px;background:rgba(255,255,255,.07);border:none;
}
input[type="range"]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,#4fc3f7,#0288d1);
    box-shadow:0 0 5px rgba(79,195,247,.3);
    cursor:pointer;border:none;
}
input[type="range"]:focus{outline:none}
.sep{height:1px;background:rgba(255,255,255,.04)}
.timer-row{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.timer-row span{font-size:.7rem;letter-spacing:.6px;color:#7788bb}
.sw{position:relative;width:44px;height:26px;cursor:pointer;touch-action:manipulation}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .tr{
    position:absolute;inset:0;background:rgba(255,255,255,.07);
    border-radius:26px;transition:.3s;
}
.sw .tr::before{
    content:'';position:absolute;
    width:20px;height:20px;left:3px;top:3px;
    background:#556;border-radius:50%;transition:.3s;
}
.sw input:checked + .tr{background:rgba(79,195,247,.2)}
.sw input:checked + .tr::before{transform:translateX(18px);background:#4fc3f7}
.dur-wrap{max-height:0;overflow:hidden;transition:max-height .3s ease}
.dur-wrap.open{max-height:80px;overflow:visible}
.ov{
    position:fixed;inset:0;
    background:rgba(5,5,30,.88);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .5s;
    gap:10px;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.ov.show{opacity:1;pointer-events:all}
.ov h2{font-size:1.3rem;font-weight:300;letter-spacing:4px;color:#66bb6a}
.ov p{font-size:.8rem;color:rgba(176,196,255,.5);letter-spacing:1.5px}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.star{
    position:absolute;border-radius:50%;
    background:#fff;
    animation:twinkle ease-in-out infinite;
    will-change:opacity;
}
/* three visual tiers — tiny dust, mid, bright (with glow) */
.star.s1{ width:1px;   height:1px;   background:rgba(255,255,255,.55); }
.star.s2{ width:1.6px; height:1.6px; background:rgba(235,240,255,.75); }
.star.s3{
    width:2.4px; height:2.4px;
    background:#fff;
    box-shadow:0 0 4px rgba(200,220,255,.7),0 0 8px rgba(160,196,255,.35);
}
@keyframes twinkle{
    0%,100%{ opacity:.25; }
    50%{     opacity:1;   }
}
@media screen and (max-height:580px){
    .card{gap:8px;padding:14px 16px 12px}
    .breath-wrap{width:120px;height:120px}
    .title{font-size:.95rem;letter-spacing:3px}
    .phase-text{font-size:.85rem}
    .sub-text{font-size:.6rem}
    .cfg-body.open{max-height:340px}
}
@media screen and (max-height:500px){
    .card{gap:6px;padding:10px 14px 8px}
    .breath-wrap{width:100px;height:100px}
    .title{font-size:.85rem}
    .status{line-height:1.3}
}
@media screen and (max-height:420px) and (orientation:landscape){
    .card{
        flex-direction:row;flex-wrap:wrap;justify-content:center;
        max-width:95vw;
        max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);
        gap:10px;padding:12px 18px;
    }
    .header{width:100%}
    .breath-wrap{width:110px;height:110px}
    .cfg-wrap{width:100%}
}
@media screen and (min-width:390px) and (min-height:700px){
    .card{gap:16px;padding:24px 28px 22px}
}
@media screen and (min-width:768px){
    .card{max-width:400px;padding:30px 36px 28px;gap:18px}
    .breath-wrap{width:220px;height:220px}
    .title{font-size:1.3rem}
    .phase-text{font-size:1.1rem}
}
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:192dpi){
    .ring-fg,.ring-bg{stroke-width:2}
}
@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
    .particles{display:none}
}
</style>
</head>
<body>

<div class="particles" id="ptc"></div>

<div class="ov" id="ov">
    <h2>✦ Complete ✦</h2>
    <p id="ovInfo"></p>
    <button class="b b-go" id="ovBtn">OK</button>
</div>

<div class="card">
    <div class="header">
        <span class="title">Breathe</span>
        <span class="sess-time" id="sTime">05:00</span>
    </div>

    <div class="sess-bar" id="sBar"><div class="sess-bar-fill" id="sBarF"></div></div>

    <div class="breath-wrap">
        <div class="prog-track"><div class="prog-fill" id="pFill"></div></div>
        <svg class="ring-svg" viewBox="0 0 190 190">
            <circle class="ring-bg" cx="95" cy="95" r="90"/>
            <circle class="ring-fg" id="rFg" cx="95" cy="95" r="90"/>
        </svg>
        <div class="bound">
            <div class="orb" id="orb"><span class="hold-num" id="hNum">5</span></div>
        </div>
    </div>

    <div class="status">
        <div class="phase-text" id="phTxt">Press Start</div>
        <div class="sub-text" id="subTxt"></div>
    </div>

    <div class="btns">
        <button class="b b-go" id="goBtn">Start</button>
        <button class="b b-pa" id="paBtn" disabled>Pause</button>
        <button class="b b-stop" id="stBtn" disabled>Stop</button>
    </div>

    <div class="cfg-wrap">
        <div class="cfg-toggle" id="cfgT">
            <span>Settings</span><span class="arr">▼</span>
        </div>
        <div class="cfg-body" id="cfgB">
            <div class="cfg-inner">
                <div class="row">
                    <div class="row-head"><span>Breaths</span><span class="row-val" id="vB">3</span></div>
                    <input type="range" id="rB" min="1" max="10" value="3" aria-label="Number of breaths">
                </div>
                <div class="row">
                    <div class="row-head"><span>Hold (sec)</span><span class="row-val" id="vH">5</span></div>
                    <input type="range" id="rH" min="1" max="30" value="5" aria-label="Hold duration in seconds">
                </div>
                <div class="row">
                    <div class="row-head"><span>Pace (sec)</span><span class="row-val" id="vP">4</span></div>
                    <input type="range" id="rP" min="2" max="8" value="4" step="0.5" aria-label="Pace in seconds">
                </div>
                <div class="sep"></div>
                <div class="timer-row">
                    <span>Session Timer</span>
                    <label class="sw"><input type="checkbox" id="tChk" aria-label="Toggle session timer"><span class="tr"></span></label>
                </div>
                <div class="dur-wrap" id="dWrap">
                    <div class="row">
                        <div class="row-head"><span>Duration</span><span class="row-val" id="vD">5 min</span></div>
                        <input type="range" id="rD" min="1" max="60" value="5" aria-label="Session duration in minutes">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    // ---------- state ----------
    var nB = 3, hT = 5, bP = 4, sM = 5, tOn = false;
    var run = false, psd = false, ph = 'idle', cB = 0, cy = 0;
    var pT0 = 0, pD = 0, pE = 0;
    var sT0 = 0, sMs = 0, sEP = 0, sI = null, sDone = false;
    var af = null;
    var C = 2 * Math.PI * 90; // ring circumference

    var rAF = window.requestAnimationFrame || function (cb) { return setTimeout(cb, 16); };
    var cAF = window.cancelAnimationFrame || function (id) { clearTimeout(id); };
    var now = function () { return performance.now(); };

    var $ = function (id) { return document.getElementById(id); };

    // ---------- refs ----------
    var orb = $('orb'), phTxt = $('phTxt'), subTxt = $('subTxt'), hNum = $('hNum');
    var rFg = $('rFg'), pFill = $('pFill');
    var goBtn = $('goBtn'), paBtn = $('paBtn'), stBtn = $('stBtn');
    var sTime = $('sTime'), sBar = $('sBar'), sBarF = $('sBarF');
    var dWrap = $('dWrap');

    // ---------- helpers ----------
    function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

    function ft(s) {
        s = Math.max(0, Math.ceil(s));
        return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
    }

    // orb is rendered at 2.1x its visual rest-size so that the animation peak
    // (logical scale 2.1) lands on physical scale 1.0 — no upscaling, no blur.
    // All setOrbScale() calls below use the original logical values.
    var ORB_DOWN = 1 / 2.1;
    function setOrbScale(v) { orb.style.transform = 'scale(' + (v * ORB_DOWN) + ')'; }

    function bindRange(el, cb) {
        el.addEventListener('input', cb, false);
        el.addEventListener('change', cb, false);
    }

    // ---------- UI listeners ----------
    goBtn.addEventListener('click', go, false);
    paBtn.addEventListener('click', pa, false);
    stBtn.addEventListener('click', st, false);
    $('ovBtn').addEventListener('click', function () { $('ov').classList.remove('show'); }, false);

    $('cfgT').addEventListener('click', function () {
        this.classList.toggle('open');
        $('cfgB').classList.toggle('open');
    }, false);

    $('tChk').addEventListener('change', tMode, false);

    bindRange($('rB'), function (e) { nB = +e.target.value; $('vB').textContent = nB; });
    bindRange($('rH'), function (e) { hT = +e.target.value; $('vH').textContent = hT; });
    bindRange($('rP'), function (e) { bP = +e.target.value; $('vP').textContent = bP; });
    bindRange($('rD'), function (e) {
        sM = +e.target.value;
        $('vD').textContent = sM < 60 ? sM + ' min' : Math.floor(sM / 60) + 'h' + (sM % 60 ? ' ' + (sM % 60) + 'm' : '');
        if (!run) sTime.textContent = ft(sM * 60);
    });

    function tMode() {
        tOn = $('tChk').checked;
        if (tOn) {
            dWrap.classList.add('open');
            sTime.className = 'sess-time on';
            sTime.textContent = ft(sM * 60);
        } else {
            dWrap.classList.remove('open');
            sTime.classList.remove('on');
            sBar.classList.remove('on');
        }
    }

    // ---------- session lifecycle ----------
    function go() {
        if (run) return;
        run = true; psd = false; cy = 0; pE = 0; sDone = false;
        goBtn.disabled = true; paBtn.disabled = false; stBtn.disabled = false;
        $('cfgT').classList.remove('open');
        $('cfgB').classList.remove('open');
        if (tOn) {
            sMs = sM * 6e4; sT0 = now(); sEP = 0;
            sBar.classList.add('on'); sBarF.style.width = '0%';
            sTime.className = 'sess-time on';
            startSI();
        }
        startCy();
    }

    function pa() {
        if (!run) return;
        if (!psd) {
            psd = true;
            if (af) { cAF(af); af = null; }
            pE = now() - pT0;
            if (tOn) { sEP += now() - sT0; clearInterval(sI); }
            orb.classList.add('dim');
            phTxt.textContent = 'Paused';
            phTxt.classList.add('blink');
            paBtn.textContent = 'Resume';
            paBtn.className = 'b b-res';
        } else {
            psd = false;
            pT0 = now() - pE;
            if (tOn) { sT0 = now(); startSI(); }
            orb.classList.remove('dim');
            phTxt.classList.remove('blink');
            phTxt.textContent = ph === 'inhale' ? 'Inhale' : ph === 'exhale' ? 'Exhale' : 'Hold';
            paBtn.textContent = 'Pause';
            paBtn.className = 'b b-pa';
            anim();
        }
    }

    function st() {
        run = false; psd = false; ph = 'idle'; pE = 0; sDone = false;
        if (af) { cAF(af); af = null; }
        clearInterval(sI);
        goBtn.disabled = false; paBtn.disabled = true; stBtn.disabled = true;
        paBtn.textContent = 'Pause';
        paBtn.className = 'b b-pa';
        setOrbScale(1);
        orb.className = 'orb';
        phTxt.textContent = 'Press Start';
        phTxt.classList.remove('blink');
        subTxt.textContent = '';
        hNum.classList.remove('vis');
        rFg.style.strokeDashoffset = C;
        pFill.style.width = '0%';
        sBar.classList.remove('on');
        sBarF.style.width = '0%';
        if (tOn) { sTime.textContent = ft(sM * 60); sTime.className = 'sess-time on'; }
    }

    // ---------- session timer ----------
    function startSI() { clearInterval(sI); sI = setInterval(updS, 200); }

    function updS() {
        if (!run || psd || !tOn) return;
        var el = sEP + (now() - sT0);
        var rem = (sMs - el) / 1e3;
        sTime.textContent = ft(rem);
        sBarF.style.width = Math.min(el / sMs * 100, 100) + '%';
        if (rem <= 0) {
            sTime.textContent = '00:00';
            sTime.className = 'sess-time on done';
            clearInterval(sI);
            sDone = true;
        } else if (rem <= 10) {
            sTime.className = 'sess-time on crit';
        } else if (rem <= 30) {
            sTime.className = 'sess-time on warn';
        } else {
            sTime.className = 'sess-time on';
        }
    }

    function showDone() {
        $('ovInfo').textContent = cy + ' cycle' + (cy !== 1 ? 's' : '') + ' completed';
        $('ov').classList.add('show');
        st();
    }

    // ---------- cycle / phases ----------
    function startCy() {
        if (!run || psd) return;
        if (tOn && sDone) { showDone(); return; }
        cy++; subTxt.textContent = 'Cycle ' + cy; cB = 0; nxt();
    }

    function nxt() {
        if (!run || psd) return;
        cB++;
        if (cB > nB) bHold(); else bIn();
    }

    function bIn() {
        if (!run || psd) return;
        ph = 'inhale'; pD = bP * 1e3; pT0 = now(); pE = 0;
        orb.className = 'orb inhale';
        phTxt.textContent = 'Inhale';
        subTxt.textContent = 'Breath ' + cB + ' / ' + nB + '  ·  Cycle ' + cy;
        hNum.classList.remove('vis');
        rFg.style.stroke = '#4fc3f7';
        anim();
    }

    function bEx() {
        if (!run || psd) return;
        ph = 'exhale'; pD = bP * 1e3; pT0 = now(); pE = 0;
        orb.className = 'orb exhale';
        phTxt.textContent = 'Exhale';
        rFg.style.stroke = '#7e57c2';
        anim();
    }

    function bHold() {
        if (!run || psd) return;
        ph = 'hold'; pD = hT * 1e3; pT0 = now(); pE = 0;
        orb.className = 'orb hold';
        setOrbScale(1.2);
        phTxt.textContent = 'Hold';
        subTxt.textContent = 'Cycle ' + cy;
        hNum.classList.add('vis');
        hNum.textContent = hT;
        rFg.style.stroke = '#ffb74d';
        anim();
    }

    function anim() {
        if (!run || psd) return;
        var el = now() - pT0;
        var p = el / pD;
        if (p > 1) p = 1;

        // Progress bar fills at a uniform rate across the whole cycle,
        // weighted by real time: total cycle = nB inhales + nB exhales + 1 hold.
        var totT = nB * 2 * bP + hT;
        var phStart, phDur;
        if (ph === 'inhale')      { phStart = (cB - 1) * 2 * bP;       phDur = bP; }
        else if (ph === 'exhale') { phStart = ((cB - 1) * 2 + 1) * bP; phDur = bP; }
        else                      { phStart = nB * 2 * bP;             phDur = hT; }

        pFill.style.width = ((phStart + p * phDur) / totT * 100) + '%';
        rFg.style.strokeDashoffset = C * (1 - p);

        if (ph === 'inhale') {
            setOrbScale(1 + p * 1.1);
        } else if (ph === 'exhale') {
            setOrbScale(2.1 - p * 1.1);
        } else {
            var rem = Math.ceil((pD - el) / 1e3);
            hNum.textContent = rem < 0 ? 0 : rem;
            setOrbScale(1.2 + Math.sin(el * .003) * .04);
        }

        if (p >= 1) {
            if (ph === 'inhale') bEx();
            else if (ph === 'exhale') nxt();
            else {
                hNum.classList.remove('vis');
                pFill.style.width = '0%';
                startCy();
            }
            return;
        }
        af = rAF(anim);
    }

    // ---------- visibility plumbing ----------
    var hiddenProp = 'hidden', visEvt = 'visibilitychange';
    if (typeof document.webkitHidden !== 'undefined') { hiddenProp = 'webkitHidden'; visEvt = 'webkitvisibilitychange'; }

    // ---------- starfield ----------
    (function () {
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var c = $('ptc');
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // star counts per tier (tiny dust, medium, bright)
        var nS1 = isMobile ? 80  : 140;
        var nS2 = isMobile ? 38  : 65;
        var nS3 = isMobile ? 10  : 16;

        var frag = document.createDocumentFragment();

        function addStars(count, cls) {
            for (var i = 0; i < count; i++) {
                var s = document.createElement('div');
                s.className = 'star ' + cls;
                // uniform-ish scatter; avoid center-band where the card sits
                var top = Math.random() * 100;
                // twinkle timings: longer for dust (calmer), shorter for bright (livelier)
                var dur = (cls === 's3' ? 2.5 : cls === 's2' ? 4 : 5.5) + Math.random() * 3;
                var delay = -Math.random() * dur; // negative → stars start mid-cycle, desync
                s.style.cssText =
                    'left:' + (Math.random() * 100) + '%;' +
                    'top:' + top + '%;' +
                    (reduced
                        ? 'opacity:' + (0.4 + Math.random() * 0.5) + ';animation:none;'
                        : 'animation-duration:' + dur + 's;animation-delay:' + delay + 's;');
                frag.appendChild(s);
            }
        }

        addStars(nS1, 's1');
        addStars(nS2, 's2');
        addStars(nS3, 's3');
        c.appendChild(frag);
    })();

    // ---------- visibility / layout ----------
    document.addEventListener(visEvt, function () {
        if (document[hiddenProp] && run && !psd) pa();
    }, false);

    var resizeTimer;
    function handleResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            document.body.style.minHeight = window.innerHeight + 'px';
        }, 100);
    }
    window.addEventListener('resize', handleResize, false);
    window.addEventListener('orientationchange', function () { setTimeout(handleResize, 200); }, false);
    document.body.style.minHeight = window.innerHeight + 'px';
})();
</script>
</body>
